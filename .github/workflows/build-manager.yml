name: Build FWJZ Pro Fullscreen Manager

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create iOS Pure Fullscreen Code
        run: |
          mkdir -p FWJZMaster
          cat << 'EOF' > FWJZMaster/main.m
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>

          @interface MasterViewController : UIViewController <UITableViewDelegate, UITableViewDataSource, UITextFieldDelegate>
          @property (nonatomic, strong) UIView *headerView;
          @property (nonatomic, strong) UILabel *lblServerStatus;
          @property (nonatomic, strong) UILabel *lblMetrics;
          @property (nonatomic, strong) UITableView *tableView;
          @property (nonatomic, strong) NSMutableArray *botList;
          @property (nonatomic, strong) UIActivityIndicatorView *spinner;
          @property (nonatomic, strong) NSString *apiHost;
          @property (nonatomic, strong) NSString *apiKey;
          @end

          @implementation MasterViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.04 green:0.04 blue:0.07 alpha:1.0];
              
              // Đọc cấu hình từ bộ nhớ máy
              NSUserDefaults *prefs = [NSUserDefaults standardUserDefaults];
              self.apiHost = [prefs stringForKey:@"fwjz_host"] ?: @"http://127.0.0.1:5000";
              self.apiKey = [prefs stringForKey:@"fwjz_key"] ?: @"fwjz_secret_key_2026";
              self.botList = [NSMutableArray array];

              [self buildInterface];
              [self syncWithServer];
          }

          - (void)buildInterface {
              UILayoutGuide *safe = self.view.safeAreaLayoutGuide;

              // 1. HEADER BAR CHUẨN SAFE AREA (Full màn hình, không lỗi viền đen)
              self.headerView = [[UIView alloc] init];
              self.headerView.translatesAutoresizingMaskIntoConstraints = NO;
              self.headerView.backgroundColor = [UIColor colorWithRed:0.07 green:0.08 blue:0.13 alpha:0.9];
              self.headerView.layer.cornerRadius = 16.0;
              self.headerView.layer.borderWidth = 1.0;
              self.headerView.layer.borderColor = [UIColor colorWithRed:0.0 green:0.8 blue:0.9 alpha:0.3].CGColor;
              [self.view addSubview:self.headerView];

              UILabel *brandTitle = [[UILabel alloc] init];
              brandTitle.translatesAutoresizingMaskIntoConstraints = NO;
              brandTitle.text = @"⚡ FWJZ BOT CONTROL HUB";
              brandTitle.textColor = [UIColor colorWithRed:0.0 green:0.95 blue:0.85 alpha:1.0];
              brandTitle.font = [UIFont boldSystemFontOfSize:17];
              [self.headerView addSubview:brandTitle];

              UIButton *btnConfig = [UIButton buttonWithType:UIButtonTypeCustom];
              btnConfig.translatesAutoresizingMaskIntoConstraints = NO;
              btnConfig.backgroundColor = [UIColor colorWithRed:0.12 green:0.16 blue:0.25 alpha:1.0];
              btnConfig.layer.cornerRadius = 17.0;
              btnConfig.layer.borderWidth = 1.0;
              btnConfig.layer.borderColor = [UIColor cyanColor].CGColor;
              [btnConfig setTitle:@"⚙️" forState:UIControlStateNormal];
              [btnConfig addTarget:self action:@selector(openSettingsModal) forControlEvents:UIControlEventTouchUpInside];
              [self.headerView addSubview:btnConfig];

              // 2. SERVER STATUS OVERVIEW CARD
              UIView *statusCard = [[UIView alloc] init];
              statusCard.translatesAutoresizingMaskIntoConstraints = NO;
              statusCard.backgroundColor = [UIColor colorWithRed:0.08 green:0.09 blue:0.15 alpha:0.95];
              statusCard.layer.cornerRadius = 14.0;
              statusCard.layer.borderWidth = 1.0;
              statusCard.layer.borderColor = [UIColor colorWithWhite:0.2 alpha:0.6].CGColor;
              [self.view addSubview:statusCard];

              UIView *ledDot = [[UIView alloc] init];
              ledDot.translatesAutoresizingMaskIntoConstraints = NO;
              ledDot.backgroundColor = [UIColor colorWithRed:0.1 green:0.9 blue:0.4 alpha:1.0];
              ledDot.layer.cornerRadius = 4.0;
              [statusCard addSubview:ledDot];

              self.lblServerStatus = [[UILabel alloc] init];
              self.lblServerStatus.translatesAutoresizingMaskIntoConstraints = NO;
              self.lblServerStatus.text = @"HOST: ĐANG KIỂM TRA...";
              self.lblServerStatus.textColor = [UIColor whiteColor];
              self.lblServerStatus.font = [UIFont boldSystemFontOfSize:12.5];
              [statusCard addSubview:self.lblServerStatus];

              self.lblMetrics = [[UILabel alloc] init];
              self.lblMetrics.translatesAutoresizingMaskIntoConstraints = NO;
              self.lblMetrics.text = @"CPU: --%  |  RAM: --/--  |  Ping: --ms";
              self.lblMetrics.textColor = [UIColor cyanColor];
              self.lblMetrics.font = [UIFont fontWithName:@"Menlo" size:11.5];
              [statusCard addSubview:self.lblMetrics];

              // Nút Sync / Refresh
              UIButton *btnSync = [UIButton buttonWithType:UIButtonTypeCustom];
              btnSync.translatesAutoresizingMaskIntoConstraints = NO;
              btnSync.backgroundColor = [UIColor colorWithRed:0.1 green:0.45 blue:0.95 alpha:1.0];
              btnSync.layer.cornerRadius = 12.0;
              [btnSync setTitle:@"⚡ ĐỒNG BỘ DỮ LIỆU VPS" forState:UIControlStateNormal];
              [btnSync setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              btnSync.titleLabel.font = [UIFont boldSystemFontOfSize:13.5];
              [btnSync addTarget:self action:@selector(syncWithServer) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:btnSync];

              self.spinner = [[UIActivityIndicatorView alloc] initWithActivityIndicatorStyle:UIActivityIndicatorViewStyleMedium];
              self.spinner.translatesAutoresizingMaskIntoConstraints = NO;
              self.spinner.color = [UIColor whiteColor];
              [btnSync addSubview:self.spinner];

              // 3. TABLE VIEW DANH SÁCH BOT
              self.tableView = [[UITableView alloc] init];
              self.tableView.translatesAutoresizingMaskIntoConstraints = NO;
              self.tableView.backgroundColor = [UIColor clearColor];
              self.tableView.separatorStyle = UITableViewCellSeparatorStyleNone;
              self.tableView.showsVerticalScrollIndicator = NO;
              self.tableView.delegate = self;
              self.tableView.dataSource = self;
              [self.view addSubview:self.tableView];

              // AUTO LAYOUT
              [NSLayoutConstraint activateConstraints:@[
                  [self.headerView.topAnchor constraintEqualToAnchor:safe.topAnchor constant:8],
                  [self.headerView.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:16],
                  [self.headerView.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-16],
                  [self.headerView.heightAnchor constraintEqualToConstant:56],

                  [brandTitle.leadingAnchor constraintEqualToAnchor:self.headerView.leadingAnchor constant:14],
                  [brandTitle.centerYAnchor constraintEqualToAnchor:self.headerView.centerYAnchor],

                  [btnConfig.trailingAnchor constraintEqualToAnchor:self.headerView.trailingAnchor constant:-12],
                  [btnConfig.centerYAnchor constraintEqualToAnchor:self.headerView.centerYAnchor],
                  [btnConfig.widthAnchor constraintEqualToConstant:34],
                  [btnConfig.heightAnchor constraintEqualToConstant:34],

                  [statusCard.topAnchor constraintEqualToAnchor:self.headerView.bottomAnchor constant:12],
                  [statusCard.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:16],
                  [statusCard.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-16],
                  [statusCard.heightAnchor constraintEqualToConstant:66],

                  [ledDot.leadingAnchor constraintEqualToAnchor:statusCard.leadingAnchor constant:14],
                  [ledDot.topAnchor constraintEqualToAnchor:statusCard.topAnchor constant:15],
                  [ledDot.widthAnchor constraintEqualToConstant:8],
                  [ledDot.heightAnchor constraintEqualToConstant:8],

                  [self.lblServerStatus.leadingAnchor constraintEqualToAnchor:ledDot.trailingAnchor constant:8],
                  [self.lblServerStatus.centerYAnchor constraintEqualToAnchor:ledDot.centerYAnchor],

                  [self.lblMetrics.leadingAnchor constraintEqualToAnchor:statusCard.leadingAnchor constant:14],
                  [self.lblMetrics.bottomAnchor constraintEqualToAnchor:statusCard.bottomAnchor constant:-12],

                  [btnSync.topAnchor constraintEqualToAnchor:statusCard.bottomAnchor constant:12],
                  [btnSync.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:16],
                  [btnSync.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-16],
                  [btnSync.heightAnchor constraintEqualToConstant:44],

                  [self.spinner.trailingAnchor constraintEqualToAnchor:btnSync.trailingAnchor constant:-20],
                  [self.spinner.centerYAnchor constraintEqualToAnchor:btnSync.centerYAnchor],

                  [self.tableView.topAnchor constraintEqualToAnchor:btnSync.bottomAnchor constant:12],
                  [self.tableView.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:16],
                  [self.tableView.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-16],
                  [self.tableView.bottomAnchor constraintEqualToAnchor:safe.bottomAnchor constant:-8]
              ]];
          }

          // CỬA SỔ CÀI ĐẶT IP HOSTING TRỰC TIẾP TRÊN APP
          - (void)openSettingsModal {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"⚙️ CÀI ĐẶT HOSTING BOT"
                                                                             message:@"Nhập địa chỉ VPS / Hosting Python của bạn:"
                                                                      preferredStyle:UIAlertControllerStyleAlert];

              [alert addTextFieldWithConfigurationHandler:^(UITextField *tf) {
                  tf.placeholder = @"http://your-ip:5000";
                  tf.text = self.apiHost;
              }];

              [alert addTextFieldWithConfigurationHandler:^(UITextField *tf) {
                  tf.placeholder = @"Secret Key";
                  tf.text = self.apiKey;
                  tf.secureTextEntry = YES;
              }];

              UIAlertAction *save = [UIAlertAction actionWithTitle:@"LƯU & KẾT NỐI" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  self.apiHost = alert.textFields[0].text;
                  self.apiKey = alert.textFields[1].text;
                  [[NSUserDefaults standardUserDefaults] setObject:self.apiHost forKey:@"fwjz_host"];
                  [[NSUserDefaults standardUserDefaults] setObject:self.apiKey forKey:@"fwjz_key"];
                  [[NSUserDefaults standardUserDefaults] synchronize];
                  [self syncWithServer];
              }];

              [alert addAction:save];
              [alert addAction:[UIAlertAction actionWithTitle:@"HỦY" style:UIAlertActionStyleCancel handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          // GỌI API THỰC TẾ ĐẾN VPS
          - (void)syncWithServer {
              UIImpactFeedbackGenerator *feed = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium];
              [feed impactOccurred];
              [self.spinner startAnimating];

              CFTimeInterval startTime = CACurrentMediaTime();
              NSString *urlStr = [NSString stringWithFormat:@"%@/api/stats", self.apiHost];
              NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:urlStr]];
              [req setValue:self.apiKey forHTTPHeaderField:@"X-API-KEY"];
              req.timeoutInterval = 5.0;

              [[[NSURLSession sharedSession] dataTaskWithRequest:req completionHandler:^(NSData *data, NSURLResponse *res, NSError *err) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self.spinner stopAnimating];
                      NSInteger ping = (NSInteger)((CACurrentMediaTime() - startTime) * 1000);

                      if (err || !data) {
                          self.lblServerStatus.text = @"HOST: MẤT KẾT NỐI";
                          self.lblServerStatus.textColor = [UIColor redColor];
                          self.lblMetrics.text = @"Kiểm tra lại IP Hosting hoặc mở Port 5000!";
                          self.lblMetrics.textColor = [UIColor colorWithWhite:0.6 alpha:1.0];
                          return;
                      }

                      NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      if (json) {
                          self.lblServerStatus.text = @"HOST: ĐANG HOẠT ĐỘNG";
                          self.lblServerStatus.textColor = [UIColor colorWithRed:0.1 green:0.9 blue:0.4 alpha:1.0];
                          self.lblMetrics.text = [NSString stringWithFormat:@"Đơn: %@  |  DT: %@đ  |  Ping: %ldms",
                                                  json[@"total_orders"], json[@"revenue"], (long)ping];

                          self.botList = [NSMutableArray arrayWithArray:json[@"orders"]];
                          [self.tableView reloadData];
                      }
                  });
              }] resume];
          }

          #pragma mark - TableView Methods
          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.botList.count;
          }

          - (CGFloat)tableView:(UITableView *)tableView heightForRowAtIndexPath:(NSIndexPath *)indexPath {
              return 72.0;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"OrderCell"];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:@"OrderCell"];
                  cell.backgroundColor = [UIColor clearColor];
                  cell.selectionStyle = UITableViewCellSelectionStyleNone;

                  UIView *card = [[UIView alloc] initWithFrame:CGRectMake(0, 4, tableView.bounds.size.width, 64)];
                  card.tag = 300;
                  card.backgroundColor = [UIColor colorWithRed:0.07 green:0.08 blue:0.13 alpha:0.95];
                  card.layer.cornerRadius = 12.0;
                  card.layer.borderWidth = 1.0;
                  card.layer.borderColor = [UIColor colorWithWhite:0.2 alpha:0.5].CGColor;
                  [cell.contentView addSubview:card];

                  UILabel *user = [[UILabel alloc] initWithFrame:CGRectMake(14, 12, 180, 18)];
                  user.tag = 301;
                  user.textColor = [UIColor whiteColor];
                  user.font = [UIFont boldSystemFontOfSize:13.5];
                  [card addSubview:user];

                  UILabel *detail = [[UILabel alloc] initWithFrame:CGRectMake(14, 34, 220, 16)];
                  detail.tag = 302;
                  detail.textColor = [UIColor colorWithWhite:0.6 alpha:1.0];
                  detail.font = [UIFont systemFontOfSize:11.5];
                  [card addSubview:detail];

                  UILabel *price = [[UILabel alloc] initWithFrame:CGRectMake(card.bounds.size.width - 110, 20, 96, 24)];
                  price.tag = 303;
                  price.textAlignment = NSTextAlignmentRight;
                  price.textColor = [UIColor colorWithRed:0.0 green:0.95 blue:0.7 alpha:1.0];
                  price.font = [UIFont boldSystemFontOfSize:14];
                  [card addSubview:price];
              }

              UIView *card = [cell.contentView viewWithTag:300];
              UILabel *user = [card viewWithTag:301];
              UILabel *detail = [card viewWithTag:302];
              UILabel *price = [card viewWithTag:303];

              NSArray *item = self.botList[indexPath.row];
              user.text = [NSString stringWithFormat:@"#%@ • @%@", item[0], item[1]];
              detail.text = [NSString stringWithFormat:@"%@", item[2]];
              price.text = [NSString stringWithFormat:@"%@đ", item[3]];

              return cell;
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.window.rootViewController = [[MasterViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          # Info.plist CÓ KHAI BÁO UILaunchScreen ĐỂ XÓA BỎ 100% VIỀN ĐEN VÀ FULL MÀN HÌNH
          cat << 'EOF' > FWJZMaster/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>vi</string>
              <key>CFBundleExecutable</key>
              <string>FWJZMaster</string>
              <key>CFBundleIdentifier</key>
              <string>com.fwjz.masterhub</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>FWJZ Hub</string>
              <key>CFBundleDisplayName</key>
              <string>FWJZ Hub</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.5.0</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>250</string>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>DTPlatformName</key>
              <string>iphoneos</string>
              <key>DTSDKName</key>
              <string>iphoneos17.0</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Build Fullscreen IPA
        run: |
          rm -rf Payload FWJZMaster.ipa
          mkdir -p Payload/FWJZMaster.app

          xcrun -sdk iphoneos clang -target arm64-apple-ios14.0 \
            -fobjc-arc -framework UIKit -framework Foundation -framework QuartzCore \
            FWJZMaster/main.m -o Payload/FWJZMaster.app/FWJZMaster

          chmod 755 Payload/FWJZMaster.app/FWJZMaster
          cp FWJZMaster/Info.plist Payload/FWJZMaster.app/
          touch Payload/FWJZMaster.app/embedded.mobileprovision
          codesign --force --deep --sign - Payload/FWJZMaster.app
          zip -qry FWJZMaster.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FWJZ-Fullscreen-Hub-IPA
          path: FWJZMaster.ipa
